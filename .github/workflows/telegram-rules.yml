name: 更新 Telegram 规则

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 UTC 03:17（北京时间 11:17）
  workflow_dispatch:
  push:
    paths:
      - Telegram/generate.py
      - .github/workflows/telegram-rules.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Telegram/generate.py
      - name: 有变化就提交
        run: |
          if git diff --quiet -- Telegram; then
            echo "规则没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add Telegram
          git commit -m "Telegram 规则：自动更新 DC 地址"
          git push
